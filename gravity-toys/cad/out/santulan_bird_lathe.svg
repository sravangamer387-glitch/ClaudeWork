<text x="20.0" y="100.0" font-size="3.0" font-family="Arial" fill="#000000">Wing-tip weights: 2 x 20 g lead-free (zinc/brass/steel) 90 mm below the beak line, about 95 mm forward of the beak tip (sim/verify_designs.py).</text>
<text x="20.0" y="105.0" font-size="3.0" font-family="Arial" fill="#000000">Tolerance +-0.5 mm on diameters; sand 240 grit; food-safe, lead-free paint (IS 9873 Part 3 / EN 71-3 heavy-metal limits).</text>
