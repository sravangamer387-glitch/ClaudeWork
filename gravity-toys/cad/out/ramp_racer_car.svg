<svg xmlns="http://www.w3.org/2000/svg" width="230mm" height="140mm" viewBox="0 0 230 140">
<text x="5.0" y="8.0" font-size="3.0" font-family="Arial" fill="#000000">RAMP RACER car: body 90 x 45 x 30 mm (rubber wood, or 3 x 10 mm birch ply laminated). Axle holes 5.0 mm for brass bush OD 5 / ID 3.2, 8 mm above the floor face, wheelbase 60 mm.</text>
<text x="5.0" y="13.0" font-size="3.0" font-family="Arial" fill="#000000">Weight pocket: 20 mm hole, 20 mm deep, from the top at the centre (swappable steel slugs 10 / 20 / 30 g). Wheels D30 x 8 mm with 3.2 mm bore; axle 3 mm steel, 55 mm long, push-on caps.</text>
