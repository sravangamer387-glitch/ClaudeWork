<svg xmlns="http://www.w3.org/2000/svg" width="260mm" height="372mm" viewBox="0 0 260 372" font-family="Noto Sans, Noto Sans Devanagari, Noto Sans Telugu, sans-serif"><g stroke="red" fill="none" stroke-width="0.3" font-size="4" >
<rect x="50" y="5" width="40" height="18"/><text x="52" y="11" fill="black" stroke="none">Elephant</text><text x="52" y="16" fill="black" stroke="none">हाथी</text><text x="52" y="21" fill="black" stroke="none">ఏనుగు</text>
<rect x="10" y="23" width="40" height="18"/><text x="12" y="29" fill="black" stroke="none">Fisherman</text><text x="12" y="34" fill="black" stroke="none">मछुआरा</text><text x="12" y="39" fill="black" stroke="none">జాలరి</text>
<rect x="50" y="23" width="40" height="18"/><text x="52" y="29" fill="black" stroke="none">Princess</text><text x="52" y="34" fill="black" stroke="none">राजकुमारी</text><text x="52" y="39" fill="black" stroke="none">రాకుమారి</text>
<rect x="90" y="23" width="40" height="18"/><text x="92" y="29" fill="black" stroke="none">Robot</text><text x="92" y="34" fill="black" stroke="none">रोबोट</text><text x="92" y="39" fill="black" stroke="none">రోబో</text>
<rect x="130" y="23" width="40" height="18"/><text x="132" y="29" fill="black" stroke="none">Monkey</text><text x="132" y="34" fill="black" stroke="none">बंदर</text><text x="132" y="39" fill="black" stroke="none">కోతి</text>
<rect x="50" y="41" width="40" height="18"/><text x="52" y="47" fill="black" stroke="none">Grandmother</text><text x="52" y="52" fill="black" stroke="none">दादी</text><text x="52" y="57" fill="black" stroke="none">బామ్మ</text>
<rect x="50" y="67" width="40" height="18"/><text x="52" y="73" fill="black" stroke="none">Railway station</text><text x="52" y="78" fill="black" stroke="none">रेलवे स्टेशन</text><text x="52" y="83" fill="black" stroke="none">రైల్వే స్టేషన్</text>
<rect x="10" y="85" width="40" height="18"/><text x="12" y="91" fill="black" stroke="none">Mango orchard</text><text x="12" y="96" fill="black" stroke="none">आम का बाग़</text><text x="12" y="101" fill="black" stroke="none">మామిడి తోట</text>
<rect x="50" y="85" width="40" height="18"/><text x="52" y="91" fill="black" stroke="none">Moon</text><text x="52" y="96" fill="black" stroke="none">चाँद</text><text x="52" y="101" fill="black" stroke="none">చంద్రుడు</text>
<rect x="90" y="85" width="40" height="18"/><text x="92" y="91" fill="black" stroke="none">Charminar</text><text x="92" y="96" fill="black" stroke="none">चारमीनार</text><text x="92" y="101" fill="black" stroke="none">చార్మినార్</text>
<rect x="130" y="85" width="40" height="18"/><text x="132" y="91" fill="black" stroke="none">Cricket ground</text><text x="132" y="96" fill="black" stroke="none">क्रिकेट मैदान</text><text x="132" y="101" fill="black" stroke="none">క్రికెట్ మైదానం</text>
<rect x="50" y="103" width="40" height="18"/><text x="52" y="109" fill="black" stroke="none">Beach</text><text x="52" y="114" fill="black" stroke="none">समुद्र तट</text><text x="52" y="119" fill="black" stroke="none">సముద్ర తీరం</text>
<rect x="50" y="129" width="40" height="18"/><text x="52" y="135" fill="black" stroke="none">A lost kite</text><text x="52" y="140" fill="black" stroke="none">खोई पतंग</text><text x="52" y="145" fill="black" stroke="none">తప్పిపోయిన గాలిపటం</text>
<rect x="10" y="147" width="40" height="18"/><text x="12" y="153" fill="black" stroke="none">A sweet laddoo</text><text x="12" y="158" fill="black" stroke="none">मीठा लड्डू</text><text x="12" y="163" fill="black" stroke="none">తీపి లడ్డు</text>
<rect x="50" y="147" width="40" height="18"/><text x="52" y="153" fill="black" stroke="none">A secret map</text><text x="52" y="158" fill="black" stroke="none">गुप्त नक्शा</text><text x="52" y="163" fill="black" stroke="none">రహస్య పటం</text>
<rect x="90" y="147" width="40" height="18"/><text x="92" y="153" fill="black" stroke="none">A friend</text><text x="92" y="158" fill="black" stroke="none">एक दोस्त</text><text x="92" y="163" fill="black" stroke="none">ఒక స్నేహితుడు</text>
<rect x="130" y="147" width="40" height="18"/><text x="132" y="153" fill="black" stroke="none">Rain</text><text x="132" y="158" fill="black" stroke="none">बारिश</text><text x="132" y="163" fill="black" stroke="none">వర్షం</text>
<rect x="50" y="165" width="40" height="18"/><text x="52" y="171" fill="black" stroke="none">A drum</text><text x="52" y="176" fill="black" stroke="none">ढोल</text><text x="52" y="181" fill="black" stroke="none">డోలు</text>
<rect x="50" y="191" width="40" height="18"/><text x="52" y="197" fill="black" stroke="none">Gets stuck</text><text x="52" y="202" fill="black" stroke="none">फँस जाना</text><text x="52" y="207" fill="black" stroke="none">చిక్కుకుపోవడం</text>
<rect x="10" y="209" width="40" height="18"/><text x="12" y="215" fill="black" stroke="none">Is very late</text><text x="12" y="220" fill="black" stroke="none">बहुत देर</text><text x="12" y="225" fill="black" stroke="none">చాలా ఆలస్యం</text>
<rect x="50" y="209" width="40" height="18"/><text x="52" y="215" fill="black" stroke="none">Loses the way</text><text x="52" y="220" fill="black" stroke="none">रास्ता भूलना</text><text x="52" y="225" fill="black" stroke="none">దారి తప్పడం</text>
<rect x="90" y="209" width="40" height="18"/><text x="92" y="215" fill="black" stroke="none">Is afraid of the dark</text><text x="92" y="220" fill="black" stroke="none">अँधेरे का डर</text><text x="92" y="225" fill="black" stroke="none">చీకటి భయం</text>
<rect x="130" y="209" width="40" height="18"/><text x="132" y="215" fill="black" stroke="none">Cannot stop laughing</text><text x="132" y="220" fill="black" stroke="none">हँसी नहीं रुकती</text><text x="132" y="225" fill="black" stroke="none">నవ్వు ఆగదు</text>
<rect x="50" y="227" width="40" height="18"/><text x="52" y="233" fill="black" stroke="none">Is very hungry</text><text x="52" y="238" fill="black" stroke="none">बहुत भूख</text><text x="52" y="243" fill="black" stroke="none">చాలా ఆకలి</text>
<rect x="50" y="253" width="40" height="18"/><text x="52" y="259" fill="black" stroke="none">A clever crow</text><text x="52" y="264" fill="black" stroke="none">चतुर कौआ</text><text x="52" y="269" fill="black" stroke="none">తెలివైన కాకి</text>
<rect x="10" y="271" width="40" height="18"/><text x="12" y="277" fill="black" stroke="none">A magic flute</text><text x="12" y="282" fill="black" stroke="none">जादुई बाँसुरी</text><text x="12" y="287" fill="black" stroke="none">మాయా వేణువు</text>
<rect x="50" y="271" width="40" height="18"/><text x="52" y="277" fill="black" stroke="none">An auto driver</text><text x="52" y="282" fill="black" stroke="none">ऑटो वाला</text><text x="52" y="287" fill="black" stroke="none">ఆటో డ్రైవర్</text>
<rect x="90" y="271" width="40" height="18"/><text x="92" y="277" fill="black" stroke="none">A talking parrot</text><text x="92" y="282" fill="black" stroke="none">बोलता तोता</text><text x="92" y="287" fill="black" stroke="none">మాట్లాడే చిలుక</text>
<rect x="130" y="271" width="40" height="18"/><text x="132" y="277" fill="black" stroke="none">A kind teacher</text><text x="132" y="282" fill="black" stroke="none">दयालु शिक्षक</text><text x="132" y="287" fill="black" stroke="none">దయగల ఉపాధ్యాయుడు</text>
<rect x="50" y="289" width="40" height="18"/><text x="52" y="295" fill="black" stroke="none">A tiny dragon</text><text x="52" y="300" fill="black" stroke="none">छोटा ड्रैगन</text><text x="52" y="305" fill="black" stroke="none">చిన్న డ్రాగన్</text>
<rect x="50" y="315" width="40" height="18"/><text x="52" y="321" fill="black" stroke="none">Everybody dances</text><text x="52" y="326" fill="black" stroke="none">सब नाचते हैं</text><text x="52" y="331" fill="black" stroke="none">అందరూ నృత్యం చేస్తారు</text>
<rect x="10" y="333" width="40" height="18"/><text x="12" y="339" fill="black" stroke="none">A big feast</text><text x="12" y="344" fill="black" stroke="none">बड़ी दावत</text><text x="12" y="349" fill="black" stroke="none">పెద్ద విందు</text>
<rect x="50" y="333" width="40" height="18"/><text x="52" y="339" fill="black" stroke="none">A new friend</text><text x="52" y="344" fill="black" stroke="none">नया दोस्त</text><text x="52" y="349" fill="black" stroke="none">కొత్త స్నేహితుడు</text>
<rect x="90" y="333" width="40" height="18"/><text x="92" y="339" fill="black" stroke="none">A surprise gift</text><text x="92" y="344" fill="black" stroke="none">अचानक तोहफ़ा</text><text x="92" y="349" fill="black" stroke="none">అనుకోని బహుమతి</text>
<rect x="130" y="333" width="40" height="18"/><text x="132" y="339" fill="black" stroke="none">It rains sweets</text><text x="132" y="344" fill="black" stroke="none">मिठाइयों की बारिश</text><text x="132" y="349" fill="black" stroke="none">మిఠాయిల వర్షం</text>
<rect x="50" y="351" width="40" height="18"/><text x="52" y="357" fill="black" stroke="none">They fly home</text><text x="52" y="362" fill="black" stroke="none">उड़कर घर</text><text x="52" y="367" fill="black" stroke="none">ఎగిరి ఇంటికి</text>
</g></svg>