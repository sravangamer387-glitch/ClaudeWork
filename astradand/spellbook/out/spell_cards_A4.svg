<text x="31.5" y="68" text-anchor="middle" font-size="2.6" fill="#868e96">Tip: draw the second shape right after the first.</text></g>
<g transform="translate(73.5,192.5)" font-family="Noto Sans, DejaVu Sans, sans-serif"><rect x="0.5" y="0.5" width="62" height="87" rx="3" fill="#10141f" stroke="#adb5bd" stroke-width="1.2"/><text x="31.5" y="13" text-anchor="middle" font-size="5.5" font-weight="700" fill="#f8f9fa">HOW TO CAST</text><text x="31.5" y="22" text-anchor="middle" font-size="2.7" fill="#dee2e6">Hold the TRIGGER, draw the shape in the air,</text><text x="31.5" y="27" text-anchor="middle" font-size="2.7" fill="#dee2e6">release. The crystal shows the spell.</text><text x="31.5" y="32" text-anchor="middle" font-size="2.7" fill="#dee2e6"></text><text x="31.5" y="37" text-anchor="middle" font-size="2.7" fill="#dee2e6">Mana starts at 100 (the lit crystals).</text><text x="31.5" y="42" text-anchor="middle" font-size="2.7" fill="#dee2e6">It refills 2 every second.</text><text x="31.5" y="47" text-anchor="middle" font-size="2.7" fill="#dee2e6">A fizzle (unknown shape) costs 5.</text><text x="31.5" y="52" text-anchor="middle" font-size="2.7" fill="#dee2e6">Each spell has a 1 s cooldown.</text><text x="31.5" y="57" text-anchor="middle" font-size="2.7" fill="#dee2e6"></text><text x="31.5" y="62" text-anchor="middle" font-size="2.7" fill="#dee2e6">After 45 s of stillness the wand sleeps.</text><text x="31.5" y="67" text-anchor="middle" font-size="2.7" fill="#dee2e6">Wave it or press the trigger to wake it.</text><text x="31.5" y="72" text-anchor="middle" font-size="2.7" fill="#dee2e6">Red blink = batteries low.</text></g>
