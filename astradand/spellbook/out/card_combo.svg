<svg xmlns="http://www.w3.org/2000/svg" width="63mm" height="88mm" viewBox="0 0 63 88" font-family="Noto Sans, DejaVu Sans, sans-serif"><rect x="0.5" y="0.5" width="62" height="87" rx="3" fill="#10141f" stroke="#e64980" stroke-width="1.2"/>
