; TRISHNA firmware - PlatformIO workspace
;   build + flash :  pio run -e esp32dev -t upload        (ESP32-DevKitC-32E; remove jumper JP1 before plugging USB in, see the manual)
;   serial console:  pio device monitor -e esp32dev
;   unit tests    :  pio test -e native                   (core library on the PC; or: make -C test/host without PlatformIO)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 core
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
lib_deps =
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.4
    pololu/VL53L1X@^1.3.1
lib_ldf_mode = deep+
test_ignore = *

[env:native]
platform = native
build_flags = -std=c11 -Wall -Wextra -lm
test_framework = unity
test_build_src = no
lib_compat_mode = off
