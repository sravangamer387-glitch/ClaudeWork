; AGROVER navigation core library - PlatformIO workspace (generated by tools/gen_pio_ini.py)
;   build: pio run        flash: pio run -t upload        monitor: pio device monitor
;   host unit tests: make test (plain gcc, see Makefile)
; library-only project: this builds the portable core for the ESP32-S3 with a stub sketch (pio/libcheck.cpp)

[platformio]
src_dir = .
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0              ; Arduino-ESP32 2.0.17 (same core as tools/esp32_build.sh)
board = esp32-s3-devkitc-1                ; ESP32-S3-WROOM-1-N8 on the project PCB
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_src_filter = -<*> +<lib/*.c> +<pio/libcheck.cpp>
build_flags = -Ilib -Isrc -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
